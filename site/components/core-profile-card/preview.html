<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview · Profile Card</title>
<meta name="robots" content="noindex">



<link rel="stylesheet" href="../assets/preview.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="profile-card.webmcp.css">
</head>
<body>
<div data-preview-root data-category="cards" data-kind="cards">
<article class="wm-card wm-card--profile" data-component="profile-card" data-user-id="u-1024">
  <div class="wm-card__avatar" aria-hidden="true">AR</div>
  <div class="wm-card__body">
    <h3 class="wm-card__title" data-context="profile-name">Ana Ruiz</h3>
    <p class="wm-card__meta" data-context="profile-role">Diseñadora de producto · Bogotá</p>
    <p class="wm-card__bio">Diseño sistemas de componentes accesibles y nativos para agentes.</p>
  </div>
  <div class="wm-card__actions">
    <button class="wm-btn wm-btn--primary" data-tool="followUser" type="button">Seguir</button>
    <a class="wm-btn wm-btn--outline" data-tool="viewProfile" href="#perfil/u-1024">Ver perfil</a>
  </div>
</article>

</div>


<script src="../assets/preview.js"></script>
</body>
</html>
