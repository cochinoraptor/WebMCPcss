<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview · Product Card</title>
<meta name="robots" content="noindex">
<script src="https://cdn.tailwindcss.com"></script>


<link rel="stylesheet" href="../assets/preview.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="product-card.webmcp.css">
</head>
<body>
<div data-preview-root data-category="cards" data-kind="cards">
<article data-component="product-card" data-product-id="SKU-42" class="w-full max-w-sm overflow-hidden rounded-[var(--wm-radius,0.5rem)] border border-slate-200 bg-white shadow-sm transition hover:-translate-y-0.5 hover:shadow-lg">
  <div class="aspect-[16/10] bg-gradient-to-br from-blue-200 to-[var(--wm-primary,#2563eb)]" role="img" aria-label="Zapatillas Runner Pro"></div>
  <div class="space-y-1 p-4">
    <h3 class="text-lg font-semibold text-slate-900" data-context="product-name">Zapatillas Runner Pro</h3>
    <p class="text-sm text-slate-500">Talla 42 · Rojo · Envío 24 h</p>
    <p class="pt-2 text-xl font-bold text-slate-900" data-context="product-price">89,90 €</p>
  </div>
  <div class="flex flex-wrap gap-2 p-4 pt-0">
    <button data-tool="addToCart" type="button" class="inline-flex min-h-[40px] items-center rounded-[var(--wm-radius,0.5rem)] bg-[var(--wm-primary,#2563eb)] px-4 text-sm font-semibold text-[var(--wm-on-primary,#fff)] hover:brightness-110">Añadir al carrito</button>
    <a data-tool="viewDetails" href="#producto/SKU-42" class="inline-flex min-h-[40px] items-center rounded-[var(--wm-radius,0.5rem)] border-2 border-[var(--wm-primary,#2563eb)] px-4 text-sm font-semibold text-[var(--wm-primary,#2563eb)] hover:bg-blue-50">Ver detalles</a>
  </div>
</article>

</div>


<script src="../assets/preview.js"></script>
</body>
</html>
