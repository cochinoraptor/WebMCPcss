<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview · Contact Form</title>
<meta name="robots" content="noindex">



<link rel="stylesheet" href="../assets/preview.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="contact-form.webmcp.css">
</head>
<body>
<div data-preview-root data-category="forms" data-kind="forms">
<form class="wm-form" data-form="contact-form" toolname="sendMessage" tooldescription="Envía un mensaje de contacto con nombre, correo y texto" toolautosubmit action="#" method="post" novalidate>
  <h2 class="wm-form__title">Contacto</h2>
  <div class="wm-field"><label for="name">Nombre</label><input id="name" name="name" type="text" required autocomplete="name" toolparamtitle="name" toolparamdescription="Nombre de quien escribe"></div>
  <div class="wm-field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" required autocomplete="email" toolparamtitle="email" toolparamdescription="Correo para responder"></div>
  <div class="wm-field"><label for="message">Mensaje</label><textarea id="message" name="message" rows="4" required toolparamtitle="message" toolparamdescription="Texto del mensaje"></textarea></div>
  <button class="wm-btn wm-btn--primary" type="submit">Enviar mensaje</button>
</form>

</div>


<script src="../assets/preview.js"></script>
</body>
</html>
