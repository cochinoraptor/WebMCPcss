<form data-form="login-form" toolname="login" tooldescription="Inicia sesión con correo y contraseña" action="#" method="post" novalidate data-slot="card" class="grid w-full max-w-sm gap-4 rounded-xl border bg-card p-6 text-card-foreground shadow-sm">
  <h2 data-slot="card-title" class="text-xl font-semibold leading-none">Iniciar sesión</h2>
  <div class="grid gap-2">
    <label data-slot="label" for="email" class="text-sm font-medium leading-none">Correo electrónico</label>
    <input data-slot="input" id="email" name="email" type="email" required autocomplete="email" toolparamtitle="email" toolparamdescription="Correo con el que te registraste" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm outline-none focus-visible:ring-[3px] focus-visible:ring-ring">
  </div>
  <div class="grid gap-2">
    <label data-slot="label" for="password" class="text-sm font-medium leading-none">Contraseña</label>
    <input data-slot="input" id="password" name="password" type="password" required minlength="8" autocomplete="current-password" toolparamtitle="password" toolparamdescription="Contraseña de la cuenta (mínimo 8 caracteres)" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-sm outline-none focus-visible:ring-[3px] focus-visible:ring-ring">
  </div>
  <button data-slot="button" type="submit" class="inline-flex h-9 w-full items-center justify-center rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground shadow-sm hover:opacity-90 focus-visible:ring-[3px] focus-visible:ring-ring">Entrar</button>
</form>
