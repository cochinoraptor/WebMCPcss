<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview · Login Form</title>
<meta name="robots" content="noindex">


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/preview.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="login-form.webmcp.css">
</head>
<body>
<div data-preview-root data-category="forms" data-kind="forms">
<form data-form="login-form" toolname="login" tooldescription="Inicia sesión con correo y contraseña" action="#" method="post" novalidate class="card card-body shadow-sm" style="max-width: 24rem">
  <h2 class="h4 mb-3">Iniciar sesión</h2>
  <div class="mb-3">
    <label for="email" class="form-label">Correo electrónico</label>
    <input type="email" class="form-control" id="email" name="email" required autocomplete="email" toolparamtitle="email" toolparamdescription="Correo con el que te registraste">
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Contraseña</label>
    <input type="password" class="form-control" id="password" name="password" required minlength="8" autocomplete="current-password" toolparamtitle="password" toolparamdescription="Contraseña de la cuenta (mínimo 8 caracteres)">
  </div>
  <button type="submit" class="btn btn-primary w-100">Entrar</button>
</form>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../assets/preview.js"></script>
</body>
</html>
