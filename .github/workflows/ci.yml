name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (sin descargar Chromium)
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Smoke test comando graph (ejemplos reales)
        run: |
          node dist/src/cli.js graph examples/ --output /tmp/graph.json --obsidian /tmp/vault
          node -e "const g=require('/tmp/graph.json'); if(!g.nodes.some(n=>n.id==='tool:addToCart')) process.exit(1);"
          test -f /tmp/vault/index.md

      - name: Smoke test exportadores multi-agente (v0.5.0)
        run: |
          for f in mcp-config claude-code cursor crewai autogen langgraph browser-inject json-schema; do
            node dist/src/cli.js export examples/shopping-cart/webmcp.css --format "$f" -o "/tmp/exp-$f" --url https://tienda.test
          done
          python3 -c "import ast; ast.parse(open('/tmp/exp-crewai/webmcp_tools.py').read())"
          node -e "JSON.parse(require('fs').readFileSync('/tmp/exp-autogen/webmcp_tools.json','utf8'))"
          node -e "new Function(require('fs').readFileSync('/tmp/exp-browser-inject/webmcp-inject.js','utf8'))"

      - name: Smoke test servidor MCP stdio (v0.5.0)
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node dist/src/cli.js mcp --serve --css examples/shopping-cart/webmcp.css > /tmp/mcp-out.txt
          node -e "
            const lines = require('fs').readFileSync('/tmp/mcp-out.txt','utf8').trim().split('\n').map(JSON.parse);
            if (lines[0].result.serverInfo.name !== 'webmcpcss') process.exit(1);
            if (!lines[1].result.tools.some(t => t.name === 'addToCart')) process.exit(1);
          "

  community-styles:
    name: Validate community styles
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (con Chromium para Puppeteer)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate community styles
        run: npm run validate:community

      - name: Community index al día
        run: node dist/scripts/build-community-index.js --check
