<!-- Andamiaje generado desde el diseño "Diseño". Los data-tool coinciden con Diseño.webmcp.css -->
<form id="buscar-form" class="ia-form" data-tool="buscar" aria-label="Buscar" novalidate>
    <div class="ia-form__field"><label for="buscar-query">Buscar</label><input id="buscar-query" type="text" name="query" data-param="query" required></div>
    <button type="submit" class="ia-button" data-tool="buscar-submit" aria-label="Buscar">Buscar</button>
    <p class="ia-form__status" data-confirmation="buscar" role="status" aria-live="polite" hidden></p>
</form>

<form id="pagar-form" class="ia-form" data-tool="pagar" aria-label="Pagar" novalidate>
    <div class="ia-form__field"><label for="pagar-email">Email</label><input id="pagar-email" type="email" name="email" data-param="email" required></div>
    <div class="ia-form__field"><label for="pagar-message">Mensaje</label><textarea id="pagar-message" name="message" data-param="message" required></textarea></div>
    <button type="submit" class="ia-button" data-tool="pagar-submit" aria-label="Pagar">Pagar</button>
    <p class="ia-form__status" data-confirmation="pagar" role="status" aria-live="polite" hidden></p>
</form>

<button type="button" class="ia-button" data-tool="anadir-al-carrito" aria-label="Añadir al carrito">Añadir al carrito</button>
