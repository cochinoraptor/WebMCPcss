<form id="send-contact-form" class="ia-form" data-tool="send-contact" aria-label="Enviar mensaje" novalidate>
    <div class="ia-form__field"><label for="send-contact-name">Nombre</label><input id="send-contact-name" type="text" name="name" data-param="name" required></div>
    <div class="ia-form__field"><label for="send-contact-email">Email</label><input id="send-contact-email" type="email" name="email" data-param="email" required></div>
    <div class="ia-form__field"><label for="send-contact-message">Mensaje</label><textarea id="send-contact-message" name="message" data-param="message" required></textarea></div>
    <button type="submit" class="ia-button" data-tool="send-contact-submit" aria-label="Enviar mensaje">Enviar mensaje</button>
    <p class="ia-form__status" data-confirmation="send-contact" role="status" aria-live="polite" hidden></p>
</form>
