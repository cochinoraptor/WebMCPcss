<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview · Product Card</title>
<meta name="robots" content="noindex">


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/preview.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="product-card.webmcp.css">
</head>
<body>
<div data-preview-root data-category="cards" data-kind="cards">
<div class="card shadow-sm" style="max-width: 22rem" data-component="product-card" data-product-id="SKU-42">
  <div class="card-img-top bg-primary bg-gradient" style="height: 11rem" role="img" aria-label="Zapatillas Runner Pro"></div>
  <div class="card-body">
    <h5 class="card-title" data-context="product-name">Zapatillas Runner Pro</h5>
    <p class="card-text text-body-secondary small">Talla 42 · Rojo · Envío 24 h</p>
    <p class="fs-4 fw-bold mb-3" data-context="product-price">89,90 €</p>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-primary" data-tool="addToCart">Añadir al carrito</button>
      <a href="#producto/SKU-42" class="btn btn-outline-primary" data-tool="viewDetails">Ver detalles</a>
    </div>
  </div>
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../assets/preview.js"></script>
</body>
</html>
