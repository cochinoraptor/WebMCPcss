<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview · Profile Card</title>
<meta name="robots" content="noindex">


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/preview.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="profile-card.webmcp.css">
</head>
<body>
<div data-preview-root data-category="cards" data-kind="cards">
<div class="card shadow-sm" style="max-width: 22rem" data-component="profile-card" data-user-id="u-1024">
  <div class="card-body">
    <div class="d-flex align-items-center gap-3 mb-3">
      <div class="rounded-circle bg-primary text-white fw-bold d-flex align-items-center justify-content-center" style="width: 4rem; height: 4rem" aria-hidden="true">AR</div>
      <div>
        <h5 class="card-title mb-0" data-context="profile-name">Ana Ruiz</h5>
        <p class="text-body-secondary small mb-0" data-context="profile-role">Diseñadora de producto · Bogotá</p>
      </div>
    </div>
    <p class="card-text">Diseño sistemas de componentes accesibles y nativos para agentes.</p>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-primary" data-tool="followUser">Seguir</button>
      <a href="#perfil/u-1024" class="btn btn-outline-primary" data-tool="viewProfile">Ver perfil</a>
    </div>
  </div>
</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../assets/preview.js"></script>
</body>
