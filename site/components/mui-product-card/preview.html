<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview · Product Card</title>
<meta name="robots" content="noindex">


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../assets/preview.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="product-card.webmcp.css">
</head>
<body>
<div data-preview-root data-category="cards" data-kind="cards">
<div class="MuiPaper-root MuiCard-root" data-component="product-card" data-product-id="SKU-42">
  <div class="MuiCardMedia-root" role="img" aria-label="Zapatillas Runner Pro"></div>
  <div class="MuiCardContent-root">
    <h5 class="MuiTypography-root MuiTypography-h5" data-context="product-name">Zapatillas Runner Pro</h5>
    <p class="MuiTypography-root MuiTypography-body2">Talla 42 · Rojo · Envío 24 h</p>
    <p class="MuiTypography-root MuiTypography-h6" data-context="product-price">89,90 €</p>
  </div>
  <div class="MuiCardActions-root">
    <button class="MuiButtonBase-root MuiButton-root MuiButton-contained MuiButton-containedPrimary" type="button" data-tool="addToCart">Añadir al carrito</button>
    <a class="MuiButtonBase-root MuiButton-root MuiButton-outlined MuiButton-outlinedPrimary" href="#producto/SKU-42" data-tool="viewDetails">Ver detalles</a>
  </div>
</div>

</div>


<script src="../assets/preview.js"></script>
</body>
</html>
