<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebMCPcss × Tailwind — Demo</title>
    <meta name="webmcp" content="webmcp.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen font-sans">
    <!-- Header -->
    <header
      id="site-header"
      class="site-header bg-indigo-600 text-white px-8 py-6 shadow-lg flex items-center justify-between"
    >
      <h1 class="text-2xl font-bold tracking-tight">WebMCPcss × Tailwind</h1>
      <nav class="flex gap-6 text-sm font-medium">
        <a href="#" class="hover:underline opacity-90">Inicio</a>
        <a href="#" class="hover:underline opacity-90">Docs</a>
        <a href="#" class="hover:underline opacity-90">GitHub</a>
      </nav>
    </header>

    <main class="max-w-3xl mx-auto p-8 space-y-8">
      <!-- Card -->
      <section
        id="feature-card"
        class="feature-card bg-white rounded-xl shadow-md p-6 border border-slate-200"
      >
        <h2 class="text-xl font-semibold text-slate-800 mb-2">
          Edición Tailwind en vivo
        </h2>
        <p class="text-slate-600 leading-relaxed">
          Un agente de IA puede cambiar el padding, los colores o la tipografía de
          esta tarjeta llamando a las herramientas WebMCP registradas por el script
          de esta página — sin tocar el código fuente.
        </p>
      </section>

      <!-- Button -->
      <div class="flex justify-center">
        <button
          id="cta-button"
          class="cta-button bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-6 py-3 rounded-lg shadow transition-colors"
        >
          Probar ahora
        </button>
      </div>

      <!-- Form -->
      <form
        id="contact-form"
        class="contact-form bg-white rounded-xl shadow-md p-6 border border-slate-200 space-y-4"
      >
        <h2 class="text-lg font-semibold text-slate-800">Contacto</h2>
        <input
          type="email"
          name="email"
          placeholder="tu@correo.com"
          class="w-full border border-slate-300 rounded-md px-4 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-400"
        />
        <textarea
          name="message"
          rows="3"
          placeholder="Tu mensaje..."
          class="w-full border border-slate-300 rounded-md px-4 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-400"
        ></textarea>
        <button
          type="submit"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2 rounded-md transition-colors"
        >
          Enviar
        </button>
      </form>
    </main>

    <!-- Registro de herramientas WebMCP de edición Tailwind (defensivo). -->
    <script>
      (function () {
        'use strict';
        var mc = navigator.modelContext;
        if (!mc || typeof mc.registerTool !== 'function') {
          console.warn('[demo] navigator.modelContext no disponible.');
          return;
        }

        function makeTool(name, selector, category, description) {
          mc.registerTool({
            name: name,
            description: description,
            inputSchema: {
              type: 'object',
              properties: {
                add: { type: 'string', description: 'Clases Tailwind a añadir' },
                remove: { type: 'string', description: 'Clases a eliminar' },
                replace: { type: 'string', description: 'Reemplazo "vieja:nueva"' },
              },
            },
            async execute(args) {
              var el = document.querySelector(selector);
              if (!el) {
                return {
                  content: [
                    { type: 'text', text: JSON.stringify({ success: false, error: 'No existe ' + selector }) },
                  ],
                };
              }
              var added = [], removed = [];
              if (args && args.replace) {
                var p = args.replace.split(':');
                if (p[0] && el.classList.contains(p[0].trim())) { el.classList.remove(p[0].trim()); removed.push(p[0].trim()); }
                if (p[1]) { el.classList.add(p[1].trim()); added.push(p[1].trim()); }
              }
              ((args && args.remove) || '').split(/\s+/).forEach(function (c) {
                if (c && el.classList.contains(c)) { el.classList.remove(c); removed.push(c); }
              });
              ((args && args.add) || '').split(/\s+/).forEach(function (c) {
                if (c && !el.classList.contains(c)) { el.classList.add(c); added.push(c); }
              });
              return {
                content: [
                  { type: 'text', text: JSON.stringify({ success: true, added: added, removed: removed, classList: el.className }) },
                ],
              };
            },
          });
        }

        makeTool('editSiteHeaderColors', '#site-header', 'colors', 'Edita los colores Tailwind del header (bg-indigo-600, text-white...)');
        makeTool('editFeatureCardSpacing', '#feature-card', 'spacing', 'Edita el espaciado Tailwind de la tarjeta (p-6, mb-2...)');
        makeTool('editCtaButtonColors', '#cta-button', 'colors', 'Edita los colores Tailwind del botón CTA (bg-emerald-500...)');
        makeTool('editContactFormLayout', '#contact-form', 'layout', 'Edita el layout Tailwind del formulario (space-y-4, rounded-xl...)');
        console.log('[demo] 4 herramientas Tailwind registradas via navigator.modelContext.');
      })();
    </script>
  </body>
</html>
