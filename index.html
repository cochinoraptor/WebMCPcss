<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Demo WebMCPcss · API imperativa</title>
  <!-- Auto-descubrimiento: este sitio publica su WebMCP declarativo -->
  <meta name="webmcp" content="webmcp.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; }
    button { padding: 10px 18px; border-radius: 8px; border: 0; background: #0f3460; color: #fff; cursor: pointer; }
    #status { margin-top: 12px; color: #1a7f37; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Sitio con API imperativa de WebMCP</h1>
  <p>
    Esta página registra herramientas con
    <code>navigator.modelContext.registerTool()</code> (el estándar WebMCP
    propuesto para Chrome). Ejecuta
    <code>webmcpcss validate examples/api-tools/index.html examples/api-tools/webmcp.css --api</code>
    para verlas.
  </p>
  <button id="subscribe">Suscribirse al boletín</button>
  <div id="status"></div>

  <script>
    // Registro defensivo: funciona con la API nativa de Chrome o con el
    // shim que instala WebMCPcss antes de cargar la página.
    (function () {
      var mc = navigator.modelContext;
      if (!mc || typeof mc.registerTool !== 'function') {
        console.info('navigator.modelContext no disponible; sin registro imperativo.');
        return;
      }
      mc.registerTool({
        name: 'subscribeNewsletter',
        description: 'Suscribe al usuario al boletín de noticias',
        inputSchema: {
          type: 'object',
          properties: { email: { type: 'string', description: 'Email del usuario' } },
          required: ['email'],
        },
        async execute(args) {
          document.getElementById('status').textContent =
            'Suscrito: ' + (args && args.email ? args.email : '(sin email)');
          return { content: [{ type: 'text', text: 'ok:' + (args && args.email) }] };
        },
      });
      mc.registerTool({
        name: 'getPageStatus',
        description: 'Devuelve el estado actual de la página',
        async execute() {
          return {
            content: [
              { type: 'text', text: document.getElementById('status').textContent || 'sin actividad' },
            ],
          };
        },
      });
    })();
  </script>
</body>
</html>
