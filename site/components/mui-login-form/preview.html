<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview · Login Form</title>
<meta name="robots" content="noindex">


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../assets/preview.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="login-form.webmcp.css">
</head>
<body>
<div data-preview-root data-category="forms" data-kind="forms">
<form data-form="login-form" toolname="login" tooldescription="Inicia sesión con correo y contraseña" action="#" method="post" novalidate class="MuiPaper-root" style="max-width: 24rem; padding: 24px; display: grid; gap: 8px">
  <h2 class="MuiTypography-root MuiTypography-h5">Iniciar sesión</h2>
  <div class="MuiFormControl-root MuiTextField-root">
    <label class="MuiInputLabel-root" for="email">Correo electrónico</label>
    <div class="MuiInputBase-root MuiOutlinedInput-root"><input class="MuiInputBase-input MuiOutlinedInput-input" id="email" name="email" type="email" required autocomplete="email" toolparamtitle="email" toolparamdescription="Correo con el que te registraste"></div>
  </div>
  <div class="MuiFormControl-root MuiTextField-root">
    <label class="MuiInputLabel-root" for="password">Contraseña</label>
    <div class="MuiInputBase-root MuiOutlinedInput-root"><input class="MuiInputBase-input MuiOutlinedInput-input" id="password" name="password" type="password" required minlength="8" autocomplete="current-password" toolparamtitle="password" toolparamdescription="Contraseña de la cuenta (mínimo 8 caracteres)"></div>
  </div>
  <button class="MuiButtonBase-root MuiButton-root MuiButton-contained MuiButton-containedPrimary MuiButton-fullWidth" type="submit">Entrar</button>
</form>

</div>


<script src="../assets/preview.js"></script>
</body>
</html>
