<body>
<div data-preview-root data-category="cards" data-kind="cards">
<div class="MuiPaper-root MuiCard-root" data-component="profile-card" data-user-id="u-1024">

      <h6 class="MuiTypography-root MuiTypography-h6" data-context="profile-name">Ana Ruiz</h6>

  <div class="MuiCardContent-root" style="padding-top:0"><p class="MuiTypography-root MuiTypography-body1">Diseño sistemas de componentes accesibles y nativos para agentes.</p></div>
  <div class="MuiCardActions-root">
    <button class="MuiButtonBase-root MuiButton-root MuiButton-contained MuiButton-containedPrimary" type="button" data-tool="followUser">Seguir</button>
    <a class="MuiButtonBase-root MuiButton-root MuiButton-outlined MuiButton-outlinedPrimary" href="#perfil/u-1024" data-tool="viewProfile">Ver perfil</a>
