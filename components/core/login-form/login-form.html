<form class="wm-form" data-form="login-form" toolname="login" tooldescription="Inicia sesión con correo y contraseña" action="#" method="post" novalidate>
  <h2 class="wm-form__title">Iniciar sesión</h2>
  <div class="wm-field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" required autocomplete="email" toolparamtitle="email" toolparamdescription="Correo con el que te registraste"></div>
  <div class="wm-field"><label for="password">Contraseña</label><input id="password" name="password" type="password" required minlength="8" autocomplete="current-password" toolparamtitle="password" toolparamdescription="Contraseña de la cuenta (mínimo 8 caracteres)"></div>
  <button class="wm-btn wm-btn--primary" type="submit">Entrar</button>
</form>
