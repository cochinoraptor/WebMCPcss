<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview · Profile Card</title>
<meta name="robots" content="noindex">
<script src="https://cdn.tailwindcss.com"></script>


<link rel="stylesheet" href="../assets/preview.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="profile-card.webmcp.css">
</head>
<body>
<div data-preview-root data-category="cards" data-kind="cards">
<article data-component="profile-card" data-user-id="u-1024" class="w-full max-w-sm rounded-[var(--wm-radius,0.5rem)] border border-slate-200 bg-white p-5 shadow-sm">
  <div class="flex items-center gap-4">
    <div class="grid h-16 w-16 place-items-center rounded-full bg-[var(--wm-primary,#2563eb)] font-bold text-[var(--wm-on-primary,#fff)]" aria-hidden="true">AR</div>
    <div>
      <h3 class="text-lg font-semibold text-slate-900" data-context="profile-name">Ana Ruiz</h3>
      <p class="text-sm text-slate-500" data-context="profile-role">Diseñadora de producto · Bogotá</p>
    </div>
  </div>
  <p class="mt-4 text-sm text-slate-600">Diseño sistemas de componentes accesibles y nativos para agentes.</p>
  <div class="mt-4 flex gap-2">
    <button data-tool="followUser" type="button" class="inline-flex min-h-[40px] items-center rounded-[var(--wm-radius,0.5rem)] bg-[var(--wm-primary,#2563eb)] px-4 text-sm font-semibold text-[var(--wm-on-primary,#fff)] hover:brightness-110">Seguir</button>
    <a data-tool="viewProfile" href="#perfil/u-1024" class="inline-flex min-h-[40px] items-center rounded-[var(--wm-radius,0.5rem)] border-2 border-[var(--wm-primary,#2563eb)] px-4 text-sm font-semibold text-[var(--wm-primary,#2563eb)] hover:bg-blue-50">Ver perfil</a>
  </div>
</article>

</div>


<script src="../assets/preview.js"></script>
</body>
</html>
