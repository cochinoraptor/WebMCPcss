name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (sin descargar Chromium)
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Smoke test comando graph (ejemplos reales)
        run: |
          node dist/src/cli.js graph examples/ --output /tmp/graph.json --obsidian /tmp/vault --svg /tmp/graph.svg
          node -e "const g=require('/tmp/graph.json'); if(!g.nodes.some(n=>n.id==='tool:addToCart')) process.exit(1); if(!g.metadata.fragilitySummary||!g.metadata.frameworkSummary) process.exit(1);"
          test -f /tmp/vault/index.md
          grep -q '<svg' /tmp/graph.svg

      - name: Ejemplo examples/graph al día (v0.9.0)
        run: |
          bash examples/graph/regen.sh
          git diff --exit-code -- examples/graph

      - name: Smoke test exportadores multi-agente (v0.5.0)
        run: |
          for f in mcp-config claude-code cursor deerflow flomny crewai autogen langgraph browser-inject json-schema; do
            node dist/src/cli.js export examples/shopping-cart/webmcp.css --format "$f" -o "/tmp/exp-$f" --url https://tienda.test
          done
          python3 -c "import ast; ast.parse(open('/tmp/exp-crewai/webmcp_tools.py').read())"
          python3 -c "import ast; ast.parse(open('/tmp/exp-deerflow/webmcp_tools.py').read())"
          node -e "JSON.parse(require('fs').readFileSync('/tmp/exp-autogen/webmcp_tools.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('/tmp/exp-deerflow/extensions_config.json','utf8'))"
          node -e "const c=JSON.parse(require('fs').readFileSync('/tmp/exp-flomny/flomny-mcp.json','utf8')); if(!c.mcpServers['webmcpcss-flomny']) process.exit(1)"
          node -e "new Function(require('fs').readFileSync('/tmp/exp-browser-inject/webmcp-inject.js','utf8'))"
          test -f /tmp/exp-claude-code/commands/prompt.md && test -f /tmp/exp-claude-code/skills/webmcp-audit/SKILL.md
          test -f /tmp/exp-cursor/.vscode/webmcp.code-snippets && test -f /tmp/exp-deerflow/skills/webmcp-browser/SKILL.md

      - name: Smoke test servidor MCP stdio (v0.5.0)
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node dist/src/cli.js mcp --serve --css examples/shopping-cart/webmcp.css > /tmp/mcp-out.txt
          node -e "
            const lines = require('fs').readFileSync('/tmp/mcp-out.txt','utf8').trim().split('\n').map(JSON.parse);
            if (lines[0].result.serverInfo.name !== 'webmcpcss') process.exit(1);
            if (!lines[1].result.tools.some(t => t.name === 'addToCart')) process.exit(1);
          "

      - name: Smoke test servidor MCP Flomny (v0.9.0)
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_selector_status","arguments":{"tool":"addToCart"}}}' \
            | node dist/src/cli.js mcp --serve --flomny --css examples/shopping-cart/webmcp.css > /tmp/flomny-out.txt
          node -e "
            const lines = require('fs').readFileSync('/tmp/flomny-out.txt','utf8').trim().split('\n').map(JSON.parse);
            if (lines[0].result.serverInfo.name !== 'webmcpcss-flomny') process.exit(1);
            const names = lines[1].result.tools.map(t => t.name);
            for (const n of ['list_tools','get_tool_info','get_selector_status','suggest_repair','execute_prompt','apply_animation']) if (!names.includes(n)) process.exit(1);
            const status = JSON.parse(lines[2].result.content[0].text);
            if (!status.fragility) process.exit(1);
          "

      - name: Smoke test validate-conflicts (sin navegador, validación estática)
        run: |
          node dist/src/cli.js parse examples/animation/animations.webmcp.css > /dev/null
          node dist/src/cli.js validate-conflicts --help | grep -q -- '--strict'

      - name: Smoke test comandos v1.0.0 (sin navegador, sin red, sin LLM)
        run: |
          CSS=examples/v1/tienda.webmcp.css
          node dist/src/cli.js init /tmp/v1-init --name "CI" --url https://ci.test --json > /tmp/v1-init.json
          node -e "const r=require('/tmp/v1-init.json'); if(!r.files.includes('webmcp.css')||!r.tools.length) process.exit(1)"
          node dist/src/cli.js assist "crea un formulario de contacto con nombre y email" --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const r=JSON.parse(d); if(!r.css.includes('webmcp-component: \"form\"')) process.exit(1)})"
          node dist/src/cli.js design analyze --text "Buscador con botón Buscar y botón Pagar" -o /tmp/v1-design.webmcp.css > /dev/null
          node dist/src/cli.js parse /tmp/v1-design.webmcp.css | grep -q '"buscar"'
          node dist/src/cli.js design optimize $CSS --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const r=JSON.parse(d); if(typeof r.scoreAfter!=='number') process.exit(1)})"
          node dist/src/cli.js retro scan tests/fixtures/legacy-site.html --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const r=JSON.parse(d); if(r.legacyScore<50||!r.toolMap.tools.buscar) process.exit(1)})"
          node dist/src/cli.js test generate --file $CSS --framework playwright -o /tmp/v1.spec.ts > /dev/null && grep -q "@playwright/test" /tmp/v1.spec.ts
          node dist/src/cli.js test generate --file $CSS --framework cypress -o /tmp/v1.cy.js > /dev/null && grep -q "cy.get" /tmp/v1.cy.js
          node dist/src/cli.js version snapshot --file $CSS --tag 1.0.0 -o /tmp/v1a.json > /dev/null
          node dist/src/cli.js version snapshot --file examples/v1/tienda.v2.webmcp.css --tag 2.0.0 -o /tmp/v1b.json > /dev/null
          node dist/src/cli.js version diff /tmp/v1a.json /tmp/v1b.json --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const r=JSON.parse(d); if(r.impact!=='major'||r.suggestedVersion!=='2.0.0') process.exit(1)})"
          node dist/src/cli.js version migrate /tmp/v1a.json /tmp/v1b.json -o /tmp/v1-migrated.css --notes /tmp/v1-MIGRATION.md > /dev/null && grep -q "buscarCatalogo" /tmp/v1-migrated.css
          node dist/src/cli.js doc generate --file $CSS -o /tmp/v1-docs > /dev/null && test -f /tmp/v1-docs/index.html && test -f /tmp/v1-docs/llms.txt && test -f /tmp/v1-docs/AGENTS.md
          node dist/src/cli.js security validate --file $CSS --agent "bot:restricted:orders:pay" --strict --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const r=JSON.parse(d); if(r.score<80||!r.agent) process.exit(1)})"
          node dist/src/cli.js security token --agent "bot:restricted" --secret ci-secret | grep -qE '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          node dist/src/cli.js recommend "compra 2 zapatillas rojas" --css $CSS --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const r=JSON.parse(d); if(!r.steps.some(s=>s.tool==='anadirAlCarrito')) process.exit(1)})"
          node dist/src/cli.js web3 validate --file $CSS --connector /tmp/v1-wallet.js --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const r=JSON.parse(d); if(!r.paid.some(p=>p.tool==='descargarInforme')) process.exit(1)})"
          node -e "new Function(require('fs').readFileSync('/tmp/v1-wallet.js','utf8'))"
          node dist/src/cli.js web3 deploy --export-sol /tmp/WebMCPPayments.sol > /dev/null && grep -q "contract WebMCPPayments" /tmp/WebMCPPayments.sol
          node dist/src/cli.js a11y audit --help | grep -q -- '--fail-on'

      - name: Ejemplo examples/v1 al día (v1.0.0)
        run: |
          bash examples/v1/regen.sh
          git diff --exit-code -- examples/v1

  community-styles:
    name: Validate community styles
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (con Chromium para Puppeteer)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate community styles
        run: npm run validate:community

      - name: Community index al día
        run: node dist/scripts/build-community-index.js --check

      - name: Smoke test validate-conflicts con navegador (v0.9.0)
        run: |
          node dist/src/cli.js validate-conflicts examples/animation/animations.webmcp.css \
            --url examples/animation/index.html --json > /tmp/vc.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('/tmp/vc.json','utf8'));
            if (!r.ok || !Array.isArray(r.plan) || r.plan.length === 0) process.exit(1);
            if (!Array.isArray(r.conflicts) || !r.capabilities) process.exit(1);
          "
