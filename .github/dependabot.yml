# Actualizaciones automáticas de dependencias (npm) y de las acciones de GitHub.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      dev-tooling:
        dependency-type: development
        patterns: ['*']
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Cambios mayores de runtime se revisan a mano (puppeteer rompe con frecuencia).
      - dependency-name: puppeteer
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Bogota
    labels: [dependencies, ci]
    commit-message:
      prefix: 'chore(ci)'
