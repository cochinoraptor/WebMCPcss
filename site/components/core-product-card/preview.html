<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview · Product Card</title>
<meta name="robots" content="noindex">



<link rel="stylesheet" href="../assets/preview.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="product-card.webmcp.css">
</head>
<body>
<div data-preview-root data-category="cards" data-kind="cards">
<article class="wm-card wm-card--product" data-component="product-card" data-product-id="SKU-42">
  <div class="wm-card__media" role="img" aria-label="Zapatillas Runner Pro"></div>
  <div class="wm-card__body">
    <h3 class="wm-card__title" data-context="product-name">Zapatillas Runner Pro</h3>
    <p class="wm-card__meta">Talla 42 · Rojo · Envío 24 h</p>
    <p class="wm-card__price" data-context="product-price">89,90 €</p>
  </div>
  <div class="wm-card__actions">
    <button class="wm-btn wm-btn--primary" data-tool="addToCart" type="button">Añadir al carrito</button>
    <a class="wm-btn wm-btn--outline" data-tool="viewDetails" href="#producto/SKU-42">Ver detalles</a>
  </div>
</article>

</div>


<script src="../assets/preview.js"></script>
</body>
</html>
