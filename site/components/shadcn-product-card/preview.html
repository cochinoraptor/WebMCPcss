<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview · Product Card</title>
<meta name="robots" content="noindex">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{border:'var(--border)',input:'var(--input)',ring:'var(--ring)',background:'var(--background)',foreground:'var(--foreground)',primary:{DEFAULT:'var(--primary)',foreground:'var(--primary-foreground)'},secondary:{DEFAULT:'var(--secondary)',foreground:'var(--secondary-foreground)'},destructive:{DEFAULT:'var(--destructive)',foreground:'#fff'},muted:{DEFAULT:'var(--muted)',foreground:'var(--muted-foreground)'},accent:{DEFAULT:'var(--accent)',foreground:'var(--accent-foreground)'},popover:{DEFAULT:'var(--popover)',foreground:'var(--popover-foreground)'},card:{DEFAULT:'var(--card)',foreground:'var(--card-foreground)'}},borderRadius:{lg:'var(--radius)',md:'calc(var(--radius) - 2px)',sm:'calc(var(--radius) - 4px)'}}}}</script>

<link rel="stylesheet" href="../assets/preview.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="product-card.webmcp.css">
</head>
<body>
<div data-preview-root data-category="cards" data-kind="cards">
<div data-slot="card" data-component="product-card" data-product-id="SKU-42" class="flex w-full max-w-sm flex-col gap-4 overflow-hidden rounded-xl border bg-card py-0 text-card-foreground shadow-sm">
  <div class="aspect-[16/10] w-full bg-gradient-to-br from-zinc-300 to-primary" role="img" aria-label="Zapatillas Runner Pro"></div>
  <div data-slot="card-content" class="px-6">
    <h3 data-slot="card-title" class="font-semibold leading-none" data-context="product-name">Zapatillas Runner Pro</h3>
    <p data-slot="card-description" class="mt-1.5 text-sm text-muted-foreground">Talla 42 · Rojo · Envío 24 h</p>
    <p class="mt-3 text-xl font-bold" data-context="product-price">89,90 €</p>
  </div>
  <div data-slot="card-footer" class="flex gap-2 px-6 pb-6">
    <button data-slot="button" data-tool="addToCart" type="button" class="inline-flex h-9 items-center justify-center rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground shadow-sm hover:opacity-90">Añadir al carrito</button>
    <a data-slot="button" data-variant="outline" data-tool="viewDetails" href="#producto/SKU-42" class="inline-flex h-9 items-center justify-center rounded-md border border-input bg-background px-4 text-sm font-medium shadow-sm hover:bg-accent">Ver detalles</a>
  </div>
</div>

</div>


<script src="../assets/preview.js"></script>
</body>
</html>
