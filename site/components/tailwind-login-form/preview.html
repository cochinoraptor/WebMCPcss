<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview · Login Form</title>
<meta name="robots" content="noindex">
<script src="https://cdn.tailwindcss.com"></script>


<link rel="stylesheet" href="../assets/preview.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="login-form.webmcp.css">
</head>
<body>
<div data-preview-root data-category="forms" data-kind="forms">
<form data-form="login-form" toolname="login" tooldescription="Inicia sesión con correo y contraseña" action="#" method="post" novalidate class="w-full max-w-sm space-y-4 rounded-[var(--wm-radius,0.5rem)] border border-slate-200 bg-white p-6 shadow-sm">
  <h2 class="text-xl font-semibold text-slate-900">Iniciar sesión</h2>
  <div>
    <label for="email" class="mb-1 block text-sm font-medium text-slate-700">Correo electrónico</label>
    <input id="email" name="email" type="email" required autocomplete="email" toolparamtitle="email" toolparamdescription="Correo con el que te registraste" class="w-full rounded-[var(--wm-radius,0.5rem)] border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-[var(--wm-primary,#2563eb)] focus:outline-none focus:ring-2 focus:ring-[var(--wm-primary,#2563eb)]/30">
  </div>
  <div>
    <label for="password" class="mb-1 block text-sm font-medium text-slate-700">Contraseña</label>
    <input id="password" name="password" type="password" required minlength="8" autocomplete="current-password" toolparamtitle="password" toolparamdescription="Contraseña de la cuenta (mínimo 8 caracteres)" class="w-full rounded-[var(--wm-radius,0.5rem)] border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-[var(--wm-primary,#2563eb)] focus:outline-none focus:ring-2 focus:ring-[var(--wm-primary,#2563eb)]/30">
  </div>
  <button type="submit" class="inline-flex min-h-[44px] w-full items-center justify-center rounded-[var(--wm-radius,0.5rem)] bg-[var(--wm-primary,#2563eb)] px-5 text-sm font-semibold text-[var(--wm-on-primary,#fff)] hover:brightness-110 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--wm-primary,#2563eb)]">Entrar</button>
</form>

</div>


<script src="../assets/preview.js"></script>
</body>
</html>
